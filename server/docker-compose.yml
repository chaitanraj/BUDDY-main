# version: "3.8"

services:
  app:
    build: .
    container_name: buddy-backend
    ports:
      - "5000:5000"
    restart: always
    depends_on:
      - mongo
    volumes:
      - .:/app
    env_file:
      - ./.env 

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
